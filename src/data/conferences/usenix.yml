  note: "<b>Review:</b> Double-blind (two rounds; first round evaluates first 2 pages; Operational Systems Track allows identified organizations where impractical). <b>Length:</b> Long papers max 12 pages, short papers max 6 pages, excluding references (includes appendices/tables/figures); ACM sigplan 10pt template; per-author cap of 2 submissions. <b>Platform:</b> HotCRP. <b>Preprints:</b> arXiv, technical reports, and non-peer-reviewed preprints permitted anytime (must anonymize project name if widely known); dual submissions prohibited. <b>Presentation:</b> In-person in Rennes, France (at least one author must attend to present talk and/or poster). <b>Proceedings:</b> ACM Digital Library (Open Access via ACM Open / APCs); papers of merit forwarded to ACM TOCS and CACM RH."
