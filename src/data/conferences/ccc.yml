  note: "<b>Review:</b> Lightweight double-blind. <b>Length:</b> Title page with abstract + first 10 pages for core presentation and key technical ideas; no bound on total length (material beyond abstract, references, and first 10 pages is considered supplementary and read at committee's discretion). Single-column, min 11pt font, 1-inch margins. <b>Platform:</b> HotCRP. <b>Preprints:</b> Allowed; posting drafts to arXiv/ECCC/IACR is encouraged. Dual/simultaneous submission to another conference with published proceedings or prior journal publication is prohibited. <b>Presentation:</b> Authors of accepted papers are expected to present their work at the conference (talks between 15 and 45 minutes). <b>Proceedings:</b> Leibniz International Proceedings in Informatics (LIPIcs) series under CC BY license. Select papers invited to JACM and ACM Transactions on Computation Theory (ToCT)."
