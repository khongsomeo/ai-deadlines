  note: "<b>Review:</b> Double-anonymous (Technical & ERVR tracks), Single-blind (SEIP track). <b>Length:</b> Technical: max 17 pages main text + 3 pages references/data availability (Dagstuhl LIPIcs format); ERVR: 10+2 pages regular, 4+1 pages extended abstract; SEIP: 17+3 pages full, 10+2 pages short; Registered Reports: 9+2 pages initial, 15+2 pages revision. <b>Platform:</b> HotCRP. <b>Preprints:</b> Open science encouraged; submissions must adhere to COPE ethics guidelines; accepted Stage 1 Registered Reports must be posted to arXiv. <b>Presentation:</b> In-person presentation on-site at Science Congress Center Munich is mandatory for publication. <b>Proceedings:</b> Dagstuhl LIPIcs (Open Access CC BY 4.0; transitioned from ACM/IEEE starting 2026)."
