  note: "<b>Review:</b> Double-blind (two-round reviewing with author response and revisions; senior authors must register as TPMS reserve reviewers; limit 5 submissions per author per round). <b>Length:</b> Initial submissions max 23 pages (revisions max 25 pages) in PACMPL acmart acmsmall format, excluding references, data-availability statement, and supplementary materials. <b>Platform:</b> HotCRP (https://oopsla27.hotcrp.com/). <b>Preprints:</b> Allowed on arXiv or homepages, but broad publicity on social media is prohibited; dual submission not permitted. <b>Presentation:</b> In-person at SPLASH 2027 in Prague, Czechia (remote presentations not possible). <b>Proceedings:</b> ACM PACMPL (Proceedings of the ACM on Programming Languages, Open Access in ACM Digital Library)."
