  note: "<b>Review:</b> Double-blind (quick-reject tier; mandatory inclusion of prior reviews if previously rejected; max 4 submissions/issue). <b>Length:</b> Max 12 pages main body excluding mandatory ethical considerations, open science, AI use, acknowledgments, references, and appendices (+1 page for revisions/camera-ready); requires PoPETs 2027 LaTeX template. <b>Platform:</b> HotCRP (https://submit.petsymposium.org). <b>Preprints:</b> Preprints discouraged during review; dual submissions prohibited. <b>Presentation:</b> In-person presentation in Delft, The Netherlands strongly encouraged (not strictly mandatory for publication). <b>Proceedings:</b> Proceedings on Privacy Enhancing Technologies (PoPETs, Diamond Open Access)."
