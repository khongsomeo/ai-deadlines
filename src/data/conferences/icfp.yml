  note: "<b>Review:</b> Full double-blind (two-stage review process with author response and revisions). <b>Length:</b> Max 25 pages for full papers or Functional Pearls and 12 pages for Experience Reports, excluding bibliography and optional appendix (ACM Small LaTeX template: \\documentclass[acmsmall,screen,anonymous,review]{acmart}). <b>Platform:</b> HotCRP (https://icfp27.hotcrp.com). <b>Preprints:</b> Allowed on arXiv, institutional repositories, or personal websites; broad advertising on social media or major mailing lists is prohibited during review. <b>Presentation:</b> In-person in Nijmegen, Netherlands (remote presentations accommodated only for unavoidable reasons). <b>Proceedings:</b> PACMPL (Proceedings of the ACM on Programming Languages, Gold Open Access)."
