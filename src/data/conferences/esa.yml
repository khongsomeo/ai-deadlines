  note: "<b>Review:</b> Single-blind (submissions are not anonymous; indicate Conflict of Interest with PC members). <b>Length:</b> Max 500 lines of text (excluding front matter, references, and appendix). Must use LaTeX class socg-lipics-v2021.cls (wrapper for lipics-v2021). Appendix read at PC discretion and not published in proceedings. <b>Platform:</b> EasyChair. <b>Preprints:</b> Prior published work or simultaneous dual submission prohibited. <b>Presentation:</b> In-person attendance required; at least one author must register at ALGO 2026 and present on-site. <b>Proceedings:</b> Published in the Leibniz International Proceedings in Informatics (LIPIcs) series by Schloss Dagstuhl. Features Track A (Design and Analysis of Algorithms), Track E (Engineering and Applications of Algorithms), and Track S (Simplicity Track)."
